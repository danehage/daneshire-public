name: CI

# Nothing ran the test suite automatically before this: Cloud Build deploys on
# a push to master without gating on it, so a red suite could reach production.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: danecast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The service container speaks plaintext on localhost, so TLS is opted
      # out explicitly; production points at Neon and keeps it on.
      NEON_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/danecast_test?sslmode=disable
      # FMPClient requires a key at construction; no request is made because
      # every test injects a fake MarketData.
      FMP_API_KEY: ci-placeholder-not-a-real-key
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install dependencies
        working-directory: backend
        # Same hash-pinned install the production image performs, so a lock
        # that would fail the Docker build fails here first; then the dev lock
        # (a superset with pytest etc.), which the image does not install.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory: a newly published CVE should not block an unrelated fix from
    # merging, but it should be visible on the run.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --progress-spinner off

      # Fail only on runtime deps -- what ships in the browser bundle. Dev
      # tooling (vite, tailwindcss and its globbing deps) runs only at build
      # time on CI/Cloud Build; its advisories are printed but don't fail the
      # job, so an unfixable build-tool advisory (e.g. braces,
      # GHSA-vfj7-8cjw-p6xm, no patched release) can't keep every PR red.
      - name: npm audit (runtime deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: npm audit (dev tooling, report only)
        working-directory: frontend
        run: npm audit --audit-level=moderate || true
