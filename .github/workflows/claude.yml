name: Claude

# Mention @claude in a PR or issue comment (or a PR review) and Claude Code acts
# on it: reads the thread, pushes commits to the PR's branch, replies in the
# thread. Only Dane's comments trigger it, and never the routines' own comments
# (pr-guard / issue-worker / deps sweep post as Dane but start with an HTML marker).
# This is not CI: nothing here runs on push. Auth is Dane's Claude subscription
# via the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'danehage' &&
        contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.body, '<!--')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == 'danehage' &&
        contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.body, '<!--')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'danehage' &&
        contains(github.event.review.body, '@claude') && !startsWith(github.event.review.body, '<!--'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Bash(npm ci --prefix frontend),Bash(npm run build --prefix frontend),Bash(python -m py_compile:*),Bash(git diff:*),Bash(git log:*),Bash(git status)"
            --append-system-prompt "You are working in daneshire (Danecast Trades). A merge to master IS a production deploy: Cloud Build runs alembic upgrade head on the production Neon database, then deploys. Read CLAUDE.md in full before changing anything and follow it. Do only what Dane's comment asks. Never merge, approve or close anything, never push to master, never run or dispatch workflows or deploy. Push only to the branch of the PR you were mentioned on; on an issue, work on a new claude/ branch and give Dane the link to open a PR. Do not run pytest here (there is no Postgres); GitHub CI runs the full suite on your pushed commits, so say so. If frontend/ changed, run npm ci --prefix frontend and npm run build --prefix frontend before finishing; python -m py_compile any changed .py file. If the change adds an alembic migration, say so at the top of your reply: it must be additive only (no drops, renames, or NOT NULL without a server default). Never edit backend/*.lock or compile locks. If the request needs something from the CLAUDE.md list What to ask about before doing (schema changes, new npm or pip dependencies, the scoring algorithm, Cloud Run or Cloud Scheduler config, API route structure) that Dane has not already decided, ask in your reply instead of doing it."
